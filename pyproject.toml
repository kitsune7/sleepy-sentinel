[project]
name = "sleepy-sentinel"
version = "0.1.0"
description = "Detect drowsiness before it becomes a problem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mediapipe",
  "numpy",
  "opencv-python",
  "pandas>=3.0.3",
  "pyarrow>=24.0.0",
  "scikit-learn>=1.9.0",
  "torch>=2.12.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.0",
  "ruff>=0.15.11",
]

[project.scripts]
extract_features = "data_prep.extract_features:main"
build_windows = "data_prep.windows:main"
train_alertness = "training.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_prep", "src/evaluation", "src/training"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
